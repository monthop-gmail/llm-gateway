services:
  db:
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    # pin ไว้ที่เวอร์ชันที่ทดสอบผ่าน — อัพด้วย docker compose pull หลังแก้ tag
    image: postgres:16.14-alpine
    container_name: llm-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-litellm}
      POSTGRES_USER: ${POSTGRES_USER:-litellm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-litellm} -d ${POSTGRES_DB:-litellm}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - llm-net

  litellm:
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    # LiteLLM 1.96.2 — ดู release ใหม่ที่ https://github.com/BerriAI/litellm/releases
    image: ghcr.io/berriai/litellm:v1.96.2
    container_name: llm-litellm
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    command: ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "1"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-litellm}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-litellm}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY is required}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:?LITELLM_SALT_KEY is required}
      STORE_MODEL_IN_DB: "True"
      UI_USERNAME: ${LITELLM_UI_USERNAME:-admin}
      UI_PASSWORD: ${LITELLM_UI_PASSWORD:?LITELLM_UI_PASSWORD is required}
      # --- provider credentials (ใส่เท่าที่ใช้ ที่เหลือปล่อยว่างได้) ---
      # เจ้าที่มี free tier
      HF_TOKEN: ${HF_TOKEN:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      CEREBRAS_API_KEY: ${CEREBRAS_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GITHUB_API_KEY: ${GITHUB_API_KEY:-}
      NVIDIA_NIM_API_KEY: ${NVIDIA_NIM_API_KEY:-}
      SAMBANOVA_API_KEY: ${SAMBANOVA_API_KEY:-}
      CLOUDFLARE_API_KEY: ${CLOUDFLARE_API_KEY:-}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      OKMD_API_KEY: ${OKMD_API_KEY:-}
      THAILLM_API_KEY: ${THAILLM_API_KEY:-}
      # เจ้าที่เสียเงินอย่างเดียว
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # --- self-hosted backends (ใช้ตอนเพิ่ม vLLM / Ollama) ---
      VLLM_API_BASE: ${VLLM_API_BASE:-}
      OLLAMA_API_BASE: ${OLLAMA_API_BASE:-}
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    ports:
      - "${LITELLM_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:4000/health/liveliness')\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    mem_limit: 2g
    networks:
      - llm-net
      # llm-clients = เน็ตเวิร์กสำหรับ "client ที่มาขอใช้โมเดล" เท่านั้น
      # แยกจาก llm-net ซึ่งมี db + openwebui อยู่ด้วย  client อย่าง hermes-line
      # จะได้เห็นแค่ container นี้ ไม่เห็น llm-db
      # (llm-net ยังคงไว้เพราะ openwebui + nst-opencode ต่ออยู่)
      - llm-clients

  openwebui:
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    # Open WebUI 0.11.0 — ดู release ใหม่ที่ https://github.com/open-webui/open-webui/releases
    image: ghcr.io/open-webui/open-webui:v0.11.0
    container_name: llm-openwebui
    restart: unless-stopped
    depends_on:
      - litellm
    environment:
      # ชี้ Open WebUI ไปที่ LiteLLM ตัวเดียว — โมเดลทั้งหมดมาจากที่นี่
      OPENAI_API_BASE_URL: http://litellm:4000/v1
      OPENAI_API_KEY: ${OPENWEBUI_LITELLM_KEY:?OPENWEBUI_LITELLM_KEY is required}
      # ปิด Ollama API ฝั่ง WebUI (ถ้าจะใช้ Ollama ให้ผ่าน LiteLLM แทน)
      ENABLE_OLLAMA_API: "False"
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:?WEBUI_SECRET_KEY is required}
      WEBUI_NAME: ${WEBUI_NAME:-LLM Gateway}
      # คนแรกที่สมัคร = admin, คนถัดไปต้องรออนุมัติ
      ENABLE_SIGNUP: "True"
      DEFAULT_USER_ROLE: "pending"
    volumes:
      - openwebui_data:/app/backend/data
    ports:
      - "${OPENWEBUI_PORT:-3000}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    mem_limit: 3g
    networks:
      - llm-net

volumes:
  db_data:
  openwebui_data:

networks:
  llm-net:
    name: llm-net
  # สร้างไว้ล่วงหน้าแล้ว (docker network create llm-clients) — ประกาศเป็น external
  # เพื่อให้ stack ฝั่ง client ที่ประกาศ external เหมือนกันมาต่อได้โดยไม่ผูกลำดับ up
  llm-clients:
    external: true
