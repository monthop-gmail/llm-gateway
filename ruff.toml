# กติกา lint ของ repo นี้
#
# เลือกชุดที่จับ "บั๊กจริง" เป็นหลัก ไม่เอาชุดที่บ่นเรื่องสไตล์ เพราะสคริปต์ในนี้
# เขียนให้คนอ่านเป็นเอกสารด้วย บรรทัดยาวและคอมเมนต์เยอะเป็นความตั้งใจ
line-length = 110

[lint]
select = [
    "E", "F",      # pyflakes + pycodestyle — ของพื้นฐาน
    "B",           # bugbear — จับบั๊กจริง เช่น late binding ใน loop
    "UP",          # ของที่เลิกใช้แล้วใน Python รุ่นใหม่
    "I",           # เรียง import
    "RUF",         # กฎของ ruff เอง รวม unused-noqa
    "PLW", "PLE",  # pylint เฉพาะ warning/error ไม่เอา refactor
    "ISC",         # string ต่อกันโดยลืม comma
]

ignore = [
    # สคริปต์ตรวจสุขภาพต้องจับ error ทุกชนิด ไม่ใช่แค่ที่คาดไว้ —
    # provider ใหม่โยน exception แปลก ๆ ได้เสมอ การระบุชนิดจะทำให้พลาด
    "BLE001",
    # _error_text พยายาม parse JSON ก่อน ถ้าไม่ใช่ JSON ก็ใช้ข้อความดิบ
    # การ log ตรงนี้จะกลบผลลัพธ์จริงที่กำลังจะรายงานอยู่แล้ว
    "S110",
    "E501",  # บรรทัดยาวในคอมเมนต์อธิบายเหตุผล — เป็นเนื้อหา ไม่ใช่โค้ด
]

[lint.per-file-ignores]
# test ตั้งชื่อฟังก์ชันเป็นภาษาไทยเพื่อให้รายงานผลอ่านรู้เรื่อง
"tests/*" = ["E741"]
