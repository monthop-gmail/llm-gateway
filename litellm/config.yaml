####################################################################
# LiteLLM Proxy — model catalog
#
# ชื่อโมเดลที่ client เห็น = model_name
# ปลายทางจริง = litellm_params.model  (รูปแบบ <provider>/<model>)
#
# HuggingFace: ใช้ HF_TOKEN ตัวเดียวยิงได้ทุก inference provider
#   huggingface/<org>/<model>            -> HF auto-route ไป provider ที่ว่าง (แนะนำ ทนกว่า)
#   huggingface/<provider>/<org>/<model> -> ล็อก provider (groq, novita, together, ...)
#
# เช็ครายชื่อโมเดล + provider ที่ live จริงตอนนี้:
#   curl -s https://router.huggingface.co/v1/models \
#     -H "Authorization: Bearer $HF_TOKEN" | python3 -m json.tool | less
#
# ตรวจแล้วเมื่อ 2026-08-14 — โมเดลบน HF ถูกปลด/เพิ่มเป็นระยะ ถ้าตัวไหนเริ่ม error
# ให้ไปเช็คด้วยคำสั่งข้างบนแล้วแก้บรรทัดนั้น
####################################################################

model_list:
  # ---------- เล็ก/เร็ว/ถูก ----------
  - model_name: hf/llama-3.1-8b
    litellm_params:
      model: huggingface/meta-llama/Llama-3.1-8B-Instruct
      api_key: os.environ/HF_TOKEN

  - model_name: hf/qwen2.5-7b
    litellm_params:
      model: huggingface/Qwen/Qwen2.5-7B-Instruct
      api_key: os.environ/HF_TOKEN

  - model_name: hf/gemma-3-12b
    litellm_params:
      model: huggingface/google/gemma-3-12b-it
      api_key: os.environ/HF_TOKEN

  # gpt-oss — auto-route (groq ถูกปฏิเสธด้วย token ปัจจุบัน)
  - model_name: hf/gpt-oss-20b
    litellm_params:
      model: huggingface/openai/gpt-oss-20b
      api_key: os.environ/HF_TOKEN

  # ---------- กลาง/ใหญ่ ----------
  - model_name: hf/llama-3.3-70b
    litellm_params:
      model: huggingface/meta-llama/Llama-3.3-70B-Instruct
      api_key: os.environ/HF_TOKEN

  - model_name: hf/gpt-oss-120b
    litellm_params:
      model: huggingface/openai/gpt-oss-120b
      api_key: os.environ/HF_TOKEN

  - model_name: hf/qwen3.5-397b
    litellm_params:
      model: huggingface/Qwen/Qwen3.5-397B-A17B
      api_key: os.environ/HF_TOKEN

  - model_name: hf/glm-4.7
    litellm_params:
      model: huggingface/zai-org/GLM-4.7
      api_key: os.environ/HF_TOKEN

  - model_name: hf/kimi-k2.6
    litellm_params:
      model: huggingface/moonshotai/Kimi-K2.6
      api_key: os.environ/HF_TOKEN

  # ---------- reasoning ----------
  - model_name: hf/deepseek-r1
    litellm_params:
      model: huggingface/novita/deepseek-ai/DeepSeek-R1
      api_key: os.environ/HF_TOKEN

  - model_name: hf/deepseek-v3.2
    litellm_params:
      model: huggingface/deepseek-ai/DeepSeek-V3.2
      api_key: os.environ/HF_TOKEN

  # Qwen3.6-27B — รุ่นใหม่ล่าสุดที่ยังฟรีบน HF
  # (Qwen3.8-27B ออกแล้วเมื่อ 2026-08-05 แต่ยังไม่มี provider ฟรี — ดูหมายเหตุท้ายไฟล์)
  - model_name: hf/qwen3.6-27b
    litellm_params:
      model: huggingface/Qwen/Qwen3.6-27B
      api_key: os.environ/HF_TOKEN

  # SEA-LION — โมเดล AI Singapore เน้นภาษาอาเซียนรวมไทย
  - model_name: hf/sea-lion-32b
    litellm_params:
      model: huggingface/aisingapore/Qwen-SEA-LION-v4-32B-IT
      api_key: os.environ/HF_TOKEN

  # ---------- รุ่นใหม่ (เพิ่ม 2026-08-23) ----------
  - model_name: hf/glm-5.2
    litellm_params:
      model: huggingface/zai-org/GLM-5.2
      api_key: os.environ/HF_TOKEN

  - model_name: hf/kimi-k3
    litellm_params:
      model: huggingface/moonshotai/Kimi-K3
      api_key: os.environ/HF_TOKEN

  - model_name: hf/deepseek-v4-pro
    litellm_params:
      model: huggingface/deepseek-ai/DeepSeek-V4-Pro
      api_key: os.environ/HF_TOKEN

  - model_name: hf/llama-4-scout
    litellm_params:
      model: huggingface/meta-llama/Llama-4-Scout-17B-16E-Instruct
      api_key: os.environ/HF_TOKEN

  - model_name: hf/qwen3.6-35b
    litellm_params:
      model: huggingface/Qwen/Qwen3.6-35B-A3B
      api_key: os.environ/HF_TOKEN

  - model_name: hf/gemma-4-26b
    litellm_params:
      model: huggingface/google/gemma-4-26B-A4B-it
      api_key: os.environ/HF_TOKEN

  # SEA-LION รุ่น Gemma (คนละตัวกับ hf/sea-lion-32b ที่เป็นฐาน Qwen)
  - model_name: hf/sea-lion-gemma-27b
    litellm_params:
      model: huggingface/aisingapore/Gemma-SEA-LION-v4-27B-IT
      api_key: os.environ/HF_TOKEN

  # ---------- เขียนโค้ด ----------
  - model_name: hf/qwen3-coder-next
    litellm_params:
      model: huggingface/Qwen/Qwen3-Coder-Next
      api_key: os.environ/HF_TOKEN

  ####################################################################
  # เจ้าอื่นที่มี free tier — ปลดคอมเมนต์แล้วใส่ key ใน .env
  # ตัวเลข rate limit ตรวจเมื่อ 2026-08-15 เปลี่ยนบ่อย เช็คหน้า official ก่อนพึ่งพา
  ####################################################################

  # ---------- Groq — เร็วที่สุด (LPU) ----------
  # ฟรี: 30 RPM / 14.4K req ต่อวัน / 500K token ต่อวัน (llama-3.1-8b-instant)
  # เช็ครายชื่อ: curl -s https://api.groq.com/openai/v1/models -H "Authorization: Bearer $GROQ_API_KEY"
  # ⚠️ 2026-08-23: Groq ปลด Llama ออกจาก free tier ทั้งหมดระหว่างวัน
  # (llama-3.3-70b-versatile และ llama-3.1-8b-instant คืน model_not_found)
  # เหลือที่ใช้ได้: gpt-oss-120b/20b, qwen3.6-27b, allam-2-7b, compound*

  # ---------- compound — โมเดลเดียวใน gateway ที่เข้าเว็บได้ ----------
  # Groq ให้ tool ฝั่ง server มาด้วย ตอบกลับมาพร้อม field executed_tools
  #   'search' = ค้นเว็บ | 'visit' = เปิด URL ที่ระบุ
  # ข้อจำกัด: หน้าเว็บใหญ่เกินจะคืน "Request Entity Too Large"
  - model_name: gq/compound
    litellm_params:
      model: groq/groq/compound
      api_key: os.environ/GROQ_API_KEY

  - model_name: gq/compound-mini
    litellm_params:
      model: groq/groq/compound-mini
      api_key: os.environ/GROQ_API_KEY

  - model_name: gq/gpt-oss-120b
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_API_KEY

  - model_name: gq/qwen3.6-27b
    litellm_params:
      model: groq/qwen/qwen3.6-27b
      api_key: os.environ/GROQ_API_KEY

  # ---------- Cerebras — โควต้าใหญ่สุด 1M token/วัน ----------
  # ฟรี: 1M token ต่อวัน แต่ RPM ต่ำและ context จำกัด
  # เหมาะกับงาน batch ไม่เหมาะกับ agent ที่ยิงถี่
  # เช็คโมเดลที่ใช้ได้: curl -s https://api.cerebras.ai/v1/models -H "Authorization: Bearer $CEREBRAS_API_KEY"
  #
  # หมายเหตุ: ก่อนเติมเครดิต chat completion คืน HTTP 402 "Payment required"
  # ทั้งที่ /v1/models ตอบปกติ — ถ้าเจออาการนี้ให้ไปเช็คหน้า billing
  - model_name: cb/gpt-oss-120b
    litellm_params:
      model: cerebras/gpt-oss-120b
      api_key: os.environ/CEREBRAS_API_KEY

  - model_name: cb/gemma-4-31b
    litellm_params:
      model: cerebras/gemma-4-31b
      api_key: os.environ/CEREBRAS_API_KEY

  # zai-glm-4.7 ถูก Cerebras archive แล้ว (2026-08-23): "Model zai-glm-4.7 is
  # archived and unavailable for the organization" — ตอนนี้เหลือ 2 โมเดล

  # ---------- Google Gemini (AI Studio) — context 1M ----------
  # ฟรี: ดูโควต้าจริงของบัญชีที่ https://aistudio.google.com/rate-limit
  # ⚠️ free tier ของ Google ใช้ข้อมูลไปเทรนโมเดล — อย่าส่งข้อมูลลูกค้า
  # - model_name: gemini/flash
  #   litellm_params:
  #     model: gemini/gemini-2.5-flash
  #     api_key: os.environ/GEMINI_API_KEY

  # ---------- Mistral — 1B token/เดือน ----------
  # เช็ครายชื่อ: curl -s https://api.mistral.ai/v1/models -H "Authorization: Bearer $MISTRAL_API_KEY"
  - model_name: mi/small
    litellm_params:
      model: mistral/mistral-small-latest
      api_key: os.environ/MISTRAL_API_KEY

  - model_name: mi/medium
    litellm_params:
      model: mistral/mistral-medium-latest
      api_key: os.environ/MISTRAL_API_KEY

  - model_name: mi/large
    litellm_params:
      model: mistral/mistral-large-latest
      api_key: os.environ/MISTRAL_API_KEY

  - model_name: mi/codestral
    litellm_params:
      model: mistral/codestral-latest
      api_key: os.environ/MISTRAL_API_KEY

  # devstral — ออกแบบมาสำหรับ coding agent โดยเฉพาะ
  - model_name: mi/devstral
    litellm_params:
      model: mistral/devstral-latest
      api_key: os.environ/MISTRAL_API_KEY

  - model_name: mi/ministral-8b
    litellm_params:
      model: mistral/ministral-8b-latest
      api_key: os.environ/MISTRAL_API_KEY

  # magistral — สาย reasoning ของ Mistral (เพิ่ม 2026-08-23)
  - model_name: mi/magistral-medium
    litellm_params:
      model: mistral/magistral-medium-latest
      api_key: os.environ/MISTRAL_API_KEY

  - model_name: mi/magistral-small
    litellm_params:
      model: mistral/magistral-small-latest
      api_key: os.environ/MISTRAL_API_KEY

  - model_name: mi/mistral-code
    litellm_params:
      model: mistral/mistral-code-latest
      api_key: os.environ/MISTRAL_API_KEY

  - model_name: mi/ministral-14b
    litellm_params:
      model: mistral/ministral-14b-latest
      api_key: os.environ/MISTRAL_API_KEY

  - model_name: mi/devstral-medium
    litellm_params:
      model: mistral/devstral-medium-latest
      api_key: os.environ/MISTRAL_API_KEY

  # เพิ่ม 2026-08-26 — สาย coding ของ Mistral
  - model_name: mi/mistral-code-agent
    litellm_params:
      model: mistral/mistral-code-agent-latest
      api_key: os.environ/MISTRAL_API_KEY

  # FIM = fill-in-the-middle เหมาะกับ autocomplete ในบรรณาธิการ
  - model_name: mi/mistral-code-fim
    litellm_params:
      model: mistral/mistral-code-fim-latest
      api_key: os.environ/MISTRAL_API_KEY

  - model_name: mi/ministral-3b
    litellm_params:
      model: mistral/ministral-3b-latest
      api_key: os.environ/MISTRAL_API_KEY

  # ---------- Cloudflare Workers AI — ฟรี 10,000 neurons/วัน ----------
  # ต้องมี CLOUDFLARE_ACCOUNT_ID ใน .env ด้วย
  # เช็ครายชื่อ: curl -s "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/ai/models/search?per_page=100" \
  #   -H "Authorization: Bearer $CLOUDFLARE_API_KEY"
  #
  # SEA-LION — โมเดลของ AI Singapore เน้นภาษาเอเชียตะวันออกเฉียงใต้ (มีไทย)
  - model_name: cf/sea-lion-27b
    litellm_params:
      model: cloudflare/@cf/aisingapore/gemma-sea-lion-v4-27b-it
      api_key: os.environ/CLOUDFLARE_API_KEY

  - model_name: cf/llama-3.3-70b
    litellm_params:
      model: cloudflare/@cf/meta/llama-3.3-70b-instruct-fp8-fast
      api_key: os.environ/CLOUDFLARE_API_KEY

  - model_name: cf/qwen2.5-coder-32b
    litellm_params:
      model: cloudflare/@cf/qwen/qwen2.5-coder-32b-instruct
      api_key: os.environ/CLOUDFLARE_API_KEY

  # ---------- รุ่นใหม่บน Cloudflare (เพิ่ม 2026-08-23) ----------
  # Qwen3.8-27B — ตัวที่เมื่อ 2026-08-16 ยังไม่มี provider ฟรี ตอนนี้มาอยู่ที่นี่แล้ว
  - model_name: cf/qwen3.8-27b
    litellm_params:
      model: cloudflare/@cf/qwen/qwen3.8-27b
      api_key: os.environ/CLOUDFLARE_API_KEY

  - model_name: cf/llama-4-scout
    litellm_params:
      model: cloudflare/@cf/meta/llama-4-scout-17b-16e-instruct
      api_key: os.environ/CLOUDFLARE_API_KEY

  - model_name: cf/nemotron-3-120b
    litellm_params:
      model: cloudflare/@cf/nvidia/nemotron-3-120b-a12b
      api_key: os.environ/CLOUDFLARE_API_KEY

  - model_name: cf/gemma-4-26b
    litellm_params:
      model: cloudflare/@cf/google/gemma-4-26b-a4b-it
      api_key: os.environ/CLOUDFLARE_API_KEY

  - model_name: cf/qwen3-30b-a3b
    litellm_params:
      model: cloudflare/@cf/qwen/qwen3-30b-a3b-fp8
      api_key: os.environ/CLOUDFLARE_API_KEY

  # เพิ่ม 2026-08-26 — ทดสอบยิงผ่านแล้ว
  - model_name: cf/mistral-small-24b
    litellm_params:
      model: cloudflare/@cf/mistralai/mistral-small-3.1-24b-instruct
      api_key: os.environ/CLOUDFLARE_API_KEY

  - model_name: cf/qwq-32b
    litellm_params:
      model: cloudflare/@cf/qwen/qwq-32b
      api_key: os.environ/CLOUDFLARE_API_KEY

  - model_name: cf/deepseek-r1-32b
    litellm_params:
      model: cloudflare/@cf/deepseek-ai/deepseek-r1-distill-qwen-32b
      api_key: os.environ/CLOUDFLARE_API_KEY

  - model_name: cf/granite-4-micro
    litellm_params:
      model: cloudflare/@cf/ibm-granite/granite-4.0-h-micro
      api_key: os.environ/CLOUDFLARE_API_KEY

  # @cf/meta/llama-3.2-11b-vision-instruct มี vision แต่ต้องกดยอมรับ Model Agreement
  # ที่ dash.cloudflare.com ก่อน (คืน "Model Agreement: Prior to using this model...")
  # กดแล้วปลดคอมเมนต์ได้เลย — จะเป็น vision ตัวเดียวของ gateway
  # - model_name: cf/llama-3.2-vision
  #   litellm_params:
  #     model: cloudflare/@cf/meta/llama-3.2-11b-vision-instruct
  #     api_key: os.environ/CLOUDFLARE_API_KEY

  # glm-5.2 กับ deepseek-v4-pro-0813 มีบน Cloudflare แต่ยังไม่อยู่ใน Workers Free plan
  # (error code 5035) ต้องอัปเกรดแผนก่อน

  # ---------- OpenRouter — โมเดลฟรีด้วย key เดียว ----------
  # โมเดลที่ลงท้าย :free ไม่คิดเงิน (จำกัด RPM ต่อโมเดล)
  # เช็ครายชื่อ :free ปัจจุบัน:
  #   curl -s https://openrouter.ai/api/v1/models | python3 -c \
  #     'import sys,json;[print(m["id"],m.get("context_length")) for m in json.load(sys.stdin)["data"] if m["id"].endswith(":free")]'
  - model_name: or/nemotron-ultra-550b
    litellm_params:
      model: openrouter/nvidia/nemotron-3-ultra-550b-a55b:free
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: or/nemotron-lightning
    litellm_params:
      model: openrouter/nvidia/nemotron-3.5-lightning:free
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: or/nemotron-super-120b
    litellm_params:
      model: openrouter/nvidia/nemotron-3-super-120b-a12b:free
      api_key: os.environ/OPENROUTER_API_KEY


  - model_name: or/north-mini-code
    litellm_params:
      model: openrouter/cohere/north-mini-code:free
      api_key: os.environ/OPENROUTER_API_KEY

  # เพิ่ม 2026-08-23 — ทดสอบยิงผ่านแล้ว
  - model_name: or/dots-3-note
    litellm_params:
      model: openrouter/dots-studio/dots-3-note-preview:free
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: or/laguna-s-2.1
    litellm_params:
      model: openrouter/poolside/laguna-s-2.1:free
      api_key: os.environ/OPENROUTER_API_KEY


  # เพิ่ม 2026-08-23 (รอบสอง) — ตัวที่ตกสำรวจรอบแรกเพราะกรองด้วย suffix :free
  # อย่างเดียว ทั้งที่ราคา prompt+completion = 0 เหมือนกัน
  #
  # ox-alpha — context 1M ไม่มี suffix :free
  - model_name: or/ox-alpha
    litellm_params:
      model: openrouter/stealth/ox-alpha
      api_key: os.environ/OPENROUTER_API_KEY

  # router ของ OpenRouter เอง — เลือกโมเดลฟรีที่ว่างให้อัตโนมัติ
  # ทดสอบแล้ววิ่งไป nemotron-3-ultra-550b ให้เอง เหมาะเป็น fallback ปลายทาง
  - model_name: or/auto-free
    litellm_params:
      model: openrouter/openrouter/free
      api_key: os.environ/OPENROUTER_API_KEY



  # เพิ่ม 2026-08-26 — ทดสอบยิงผ่านแล้ว
  - model_name: or/minimax-m2.7
    litellm_params:
      model: openrouter/minimax/minimax-m2.7:free
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: or/nemotron-omni-30b
    litellm_params:
      model: openrouter/nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free
      api_key: os.environ/OPENROUTER_API_KEY

  # ⚠️ 2026-08-26 ถอด or/gemma-4-31b — ขึ้น "Provider returned error" ต่อเนื่อง
  # ตัวที่ยังใช้ไม่ได้ (ลองซ้ำแล้ว): z-ai/glm-5.2:free, poolside/laguna-xs-2.1:free,
  #   liquid/lfm-2.5-2.6b:free (Provider returned error)
  #   thinkingmachines/inkling:free และ inkling-small:free (ctx 1M ทั้งคู่)
  #   ยังจำกัดเฉพาะ agentic harness
  #
  # ⚠️ 2026-08-23 (ตรวจรอบเย็น) ถอดออกเพราะตายถาวร:
  #   or/gpt-oss-20b, or/nemotron-nano-30b -> "This model is unavailable for free"
  #     (OpenRouter เปลี่ยนเป็นแบบเสียเงิน)
  #   or/nemotron-nano-9b, or/nemotron-vl-12b -> "No endpoints found"
  #     (provider ถอด endpoint ออก) — or/nemotron-vl-12b คือ vision model
  #     ตัวเดียวที่เคยมี ตอนนี้ gateway ไม่มี vision แล้ว
  #
  # ตัวที่ทดสอบแล้วใช้ไม่ได้ (2026-08-23): poolside/laguna-xs-2.1:free,
  # z-ai/glm-5.2:free, google/gemma-4-26b-a4b-it:free และ
  # nvidia/llama-nemotron-rerank-vl-1b-v2:free ขึ้น "Provider returned error"
  # thinkingmachines/inkling:free จำกัดเฉพาะ agentic harness
  # nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free แชทได้แต่ใส่ tools แล้ว
  #   คืน ResourceExhausted

  # ---------- GitHub Models — ใช้ GitHub token ที่มีอยู่แล้ว ----------
  # ฟรี: ~10-15 RPM, 50-150 req/วัน แล้วแต่ชั้นของโมเดล
  # ใช้ PAT เดิมได้เลย https://github.com/marketplace/models
  # - model_name: gh/gpt-4o-mini
  #   litellm_params:
  #     model: github/gpt-4o-mini
  #     api_key: os.environ/GITHUB_API_KEY

  # ---------- NVIDIA NIM — 100+ โมเดล https://build.nvidia.com ----------
  # เช็ครายชื่อ: curl -s https://integrate.api.nvidia.com/v1/models -H "Authorization: Bearer $NVIDIA_NIM_API_KEY"
  - model_name: nim/minimax-m3
    litellm_params:
      model: nvidia_nim/minimaxai/minimax-m3
      api_key: os.environ/NVIDIA_NIM_API_KEY

  - model_name: nim/step-3.7-flash
    litellm_params:
      model: nvidia_nim/stepfun-ai/step-3.7-flash
      api_key: os.environ/NVIDIA_NIM_API_KEY

  - model_name: nim/nemotron-nano-30b
    litellm_params:
      model: nvidia_nim/nvidia/nemotron-3-nano-30b-a3b
      api_key: os.environ/NVIDIA_NIM_API_KEY

  - model_name: nim/gemma-4-31b
    litellm_params:
      model: nvidia_nim/google/gemma-4-31b-it
      api_key: os.environ/NVIDIA_NIM_API_KEY

  - model_name: nim/mistral-nemotron
    litellm_params:
      model: nvidia_nim/mistralai/mistral-nemotron
      api_key: os.environ/NVIDIA_NIM_API_KEY

  - model_name: nim/nemotron-super-49b
    litellm_params:
      model: nvidia_nim/nvidia/llama-3.3-nemotron-super-49b-v1.5
      api_key: os.environ/NVIDIA_NIM_API_KEY

  - model_name: nim/llama-3.3-70b
    litellm_params:
      model: nvidia_nim/meta/llama-3.3-70b-instruct
      api_key: os.environ/NVIDIA_NIM_API_KEY

  - model_name: nim/deepseek-v4-flash
    litellm_params:
      model: nvidia_nim/deepseek-ai/deepseek-v4-flash-0731
      api_key: os.environ/NVIDIA_NIM_API_KEY

  # ---------- Embeddings (เติมช่องว่างที่ gateway ยังไม่มี) ----------
  # ⚠️ 2026-08-26: NVIDIA ปลด embedding หลายตัวพร้อมกัน ("has reached its end of life")
  # ที่ตายแล้ว: nv-embedqa-e5-v5 (คืน 410 Gone), nv-embed-v1,
  # llama-nemotron-embed-1b-v2, baai/bge-m3 — เหลือ nemotron-3-embed-1b ตัวเดียว

  - model_name: emb/nemotron-embed
    litellm_params:
      model: nvidia_nim/nvidia/nemotron-3-embed-1b
      api_key: os.environ/NVIDIA_NIM_API_KEY

  # ---------- Cloudflare Workers AI ----------
  # ฟรี 10,000 neurons/วัน ต้องมี CLOUDFLARE_ACCOUNT_ID ด้วย
  # - model_name: cf/llama-3-8b
  #   litellm_params:
  #     model: cloudflare/@cf/meta/llama-3-8b-instruct
  #     api_key: os.environ/CLOUDFLARE_API_KEY

  # ---------- Ollama Cloud — โมเดลใหญ่โดยไม่ต้องมี GPU ----------
  # ต่างจาก Ollama ที่รันเอง: อันนี้ Ollama โฮสต์ให้ ไม่กิน RAM/GPU ของเรา
  # เป็น OpenAI-compatible แท้ (https://ollama.com/v1) จึงใช้ prefix openai/ + api_base
  # สร้าง key: https://ollama.com/settings/keys
  # ฟรี: ใช้ได้ 7 จาก 19 โมเดล (ที่เหลือต้อง Pro $20/เดือน)
  # Ollama ไม่ประกาศตัวเลขโควต้า ดูการใช้งานจริงที่หน้า settings ของบัญชี
  # เช็ครายชื่อ: curl -s https://ollama.com/v1/models
  #
  - model_name: oc/nemotron-3-ultra
    litellm_params:
      model: openai/nemotron-3-ultra
      api_base: https://ollama.com/v1
      api_key: os.environ/OLLAMA_API_KEY

  - model_name: oc/nemotron-3-super
    litellm_params:
      model: openai/nemotron-3-super
      api_base: https://ollama.com/v1
      api_key: os.environ/OLLAMA_API_KEY

  - model_name: oc/nemotron-3-nano-30b
    litellm_params:
      model: openai/nemotron-3-nano:30b
      api_base: https://ollama.com/v1
      api_key: os.environ/OLLAMA_API_KEY

  - model_name: oc/minimax-m3
    litellm_params:
      model: openai/minimax-m3
      api_base: https://ollama.com/v1
      api_key: os.environ/OLLAMA_API_KEY

  - model_name: oc/gemma4-31b
    litellm_params:
      model: openai/gemma4:31b
      api_base: https://ollama.com/v1
      api_key: os.environ/OLLAMA_API_KEY

  - model_name: oc/gpt-oss-120b
    litellm_params:
      model: openai/gpt-oss:120b
      api_base: https://ollama.com/v1
      api_key: os.environ/OLLAMA_API_KEY

  - model_name: oc/gpt-oss-20b
    litellm_params:
      model: openai/gpt-oss:20b
      api_base: https://ollama.com/v1
      api_key: os.environ/OLLAMA_API_KEY

  # ต้องมี Pro ($20/เดือน) ขึ้นไปถึงจะใช้ได้ — ทดสอบ 2026-08-17 บนชั้นฟรีคืน
  # "this model requires a subscription": glm-5.1, glm-5.2, qwen3.5:397b,
  # mistral-large-3:675b, deepseek-v4-flash, deepseek-v4-pro, kimi-k2.6,
  # kimi-k2.7-code, kimi-k3 (ต้อง Pro + extra usage), minimax-m2.7

  # ---------- เฟสถัดไป: self-hosted ----------
  # vLLM (OpenAI-compatible server) — ตั้ง VLLM_API_BASE=http://<host>:8000/v1
  # - model_name: local/vllm-qwen
  #   litellm_params:
  #     model: hosted_vllm/Qwen/Qwen2.5-7B-Instruct
  #     api_base: os.environ/VLLM_API_BASE
  #     api_key: "dummy"
  #
  # Ollama — ตั้ง OLLAMA_API_BASE=http://<host>:11434
  # - model_name: local/ollama-llama3
  #   litellm_params:
  #     model: ollama_chat/llama3.1:8b
  #     api_base: os.environ/OLLAMA_API_BASE

  # ---------- เฟสถัดไป: cloud providers ----------
  # - model_name: gpt-4o-mini
  #   litellm_params:
  #     model: openai/gpt-4o-mini
  #     api_key: os.environ/OPENAI_API_KEY
  #
  # - model_name: claude-sonnet-5
  #   litellm_params:
  #     model: anthropic/claude-sonnet-5
  #     api_key: os.environ/ANTHROPIC_API_KEY
  #
  # - model_name: gemini-2.5-flash
  #   litellm_params:
  #     model: gemini/gemini-2.5-flash
  #     api_key: os.environ/GEMINI_API_KEY

litellm_settings:
  drop_params: true          # ตัด param ที่ provider ไม่รองรับทิ้ง แทนที่จะ error
  num_retries: 2
  request_timeout: 600
  set_verbose: false

  # ---------------------------------------------------------------
  # fallback — 2026-08-23 เครดิต HF รายเดือนหมด ("You have depleted your
  # monthly included credits") ทำให้ hf/* ใช้ไม่ได้ 20 จาก 21 ตัว
  # ตั้ง fallback ไป provider อื่นไว้ ระบบจะยังทำงานต่อโดย client ไม่ต้องแก้อะไร
  # ---------------------------------------------------------------
  fallbacks:
    - hf/llama-3.1-8b: [mi/ministral-8b, cf/llama-4-scout, or/auto-free]
    - hf/llama-3.3-70b: [cf/llama-3.3-70b, gq/gpt-oss-120b, or/auto-free]
    - hf/gpt-oss-120b: [cb/gpt-oss-120b, gq/gpt-oss-120b, oc/gpt-oss-120b, or/auto-free]
    - hf/gpt-oss-20b: [oc/gpt-oss-20b, gq/gpt-oss-120b, or/auto-free]
    - hf/qwen3-coder-next: [cf/qwen2.5-coder-32b, mi/mistral-code, or/auto-free]
    - hf/glm-5.2: [oc/nemotron-3-super, mi/magistral-medium, or/auto-free]
    - hf/kimi-k3: [oc/nemotron-3-ultra, mi/large, or/auto-free]
    - hf/deepseek-v4-pro: [mi/large, or/nemotron-ultra-550b, or/auto-free]
    - hf/sea-lion-32b: [cf/sea-lion-27b, or/auto-free]
    - hf/sea-lion-gemma-27b: [cf/sea-lion-27b, or/auto-free]
    - hf/gemma-4-26b: [cf/gemma-4-26b, cb/gemma-4-31b, or/auto-free]
    - hf/llama-4-scout: [cf/llama-4-scout, or/auto-free]
    - hf/qwen2.5-7b: [mi/ministral-8b, cb/gemma-4-31b, or/auto-free]
    - cb/gemma-4-31b: [cf/qwen2.5-coder-32b, mi/magistral-medium, or/auto-free]
    - hf/qwen3.5-397b: [or/nemotron-ultra-550b, oc/nemotron-3-ultra, or/auto-free]
    - hf/glm-4.7: [oc/nemotron-3-super, mi/magistral-medium, or/auto-free]
    - hf/kimi-k2.6: [oc/nemotron-3-ultra, mi/large, or/auto-free]
    - hf/deepseek-r1: [mi/magistral-medium, or/nemotron-super-120b, or/auto-free]
    - hf/deepseek-v3.2: [mi/large, cf/nemotron-3-120b, or/auto-free]
    - hf/qwen3.6-27b: [gq/qwen3.6-27b, cf/qwen3-30b-a3b, or/auto-free]
    - hf/qwen3.6-35b: [cf/qwen3-30b-a3b, gq/qwen3.6-27b, or/auto-free]
    - hf/gemma-3-12b: [cf/gemma-4-26b, cb/gemma-4-31b, or/auto-free]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true    # เพิ่ม/แก้โมเดลผ่าน UI ได้ โดยไม่ต้องแก้ไฟล์นี้
